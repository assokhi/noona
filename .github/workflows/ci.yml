name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: never

# contents: write for two things: pushing rustfmt's result back, and publishing
# the run log to the `ci-logs` branch. Job logs need a token to read via the
# API; a raw file on a branch does not. That is what makes CI usable as the
# build loop from a machine that cannot run the toolchain.
permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships a stable rust with cargo, clippy and rustfmt, so
      # there is no third-party toolchain action to trust here.
      - name: toolchain
        run: rustc -Vv | tee ci.log && cargo clippy --version && cargo fmt --version

      # The dev box cannot run rustfmt (Smart App Control blocks the toolchain),
      # so CI applies it and pushes the result back. [skip ci] stops the loop.
      - name: rustfmt
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          echo "== rustfmt ==" >> ci.log
          cargo fmt --all 2>&1 | tee -a ci.log
          if ! git diff --quiet -- '*.rs'; then
            git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qam "rustfmt [skip ci]"
            git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:${GITHUB_REF_NAME}"
            echo "pushed a rustfmt commit - git pull before your next push" | tee -a ci.log
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyosmium
        run: python -m pip install --quiet osmium

      # make ci = fmt + lint + test + fixture + assert. Running it through make
      # is what keeps the Makefile from rotting. The assert target builds under
      # release-assert, which is the only place the debug-only assertions run.
      - name: make ci
        shell: bash
        run: |
          set -o pipefail
          echo "== make ci ==" >> ci.log
          make ci 2>&1 | tee -a ci.log

      # Always, so a success is a readable file too and the poller never needs
      # the API. ci.log may be missing if checkout itself failed.
      - name: publish log
        if: always()
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OUTCOME: ${{ job.status }}
        run: |
          short=${GITHUB_SHA::7}
          touch ci.log
          echo "== outcome: $OUTCOME ==" >> ci.log
          mkdir -p /tmp/logs
          cp ci.log /tmp/logs/last.log
          cp ci.log "/tmp/logs/$short.log"
          cd /tmp/logs
          git init -q && git checkout -qb ci-logs && git add .
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "ci log for $short"
          git push -qf "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-logs
          echo "https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/ci-logs/$short.log"
