name: ci

on:
  push:
    branches: ["**"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ubuntu-latest ships a stable rust with cargo, clippy and rustfmt, so
      # there is no third-party toolchain action to trust here. Local dev uses
      # stable-x86_64-pc-windows-gnullvm with portable llvm-mingw as the
      # linker; this job is the evidence the project builds off that machine.
      - name: toolchain
        run: rustc -Vv && cargo clippy --version && cargo fmt --version

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: pyosmium
        run: python -m pip install --quiet osmium

      # make ci = fmt + lint + test + fixture + assert. Running it through make
      # is what keeps the Makefile from rotting. The assert target builds under
      # release-assert, which is the only place the debug-only assertions run.
      - name: make ci
        run: make ci
