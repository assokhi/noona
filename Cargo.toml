[workspace]
resolver = "2"
members = ["crates/osm-parse", "crates/graph", "crates/routing", "tools/bench"]

[workspace.package]
version = "0.1.0"
edition = "2021"

# Assertions that guard an expensive algorithmic invariant stay debug-only, so
# they need a build that actually runs them. CI exercises the fixture build and
# a reduced bench under this profile.
[profile.release-assert]
inherits = "release"
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
debug = 1
